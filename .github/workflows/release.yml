name: Release

# Push a tag like v0.2.0 (matching module.json) to publish a GitHub Release with
# heroes-theme.zip and module.json attached, then register that version on the
# foundryvtt.com package listing through the Package Release API. Installed
# copies update from the releases/latest/download/module.json manifest URL.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      packages: read # install @breno-hof/heroes-theme-core from GitHub Packages
      id-token: write # OIDC identity for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Check tag matches module.json and package.json versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          module_version="$(node -p "require('./module.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          if ! [[ "$module_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::module.json version '$module_version' is not valid semver"; exit 1
          fi
          if [[ "$TAG" != "v$module_version" || "$module_version" != "$package_version" ]]; then
            echo "::error::tag $TAG, module.json $module_version and package.json $package_version must agree"; exit 1
          fi

      - name: Install dependencies
        run: if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run check

      - name: Package
        run: cd dist && zip -r ../heroes-theme.zip .

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: heroes-theme.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" heroes-theme.zip dist/module.json --title "$TAG" --generate-notes --verify-tag

      # Needs the package's "Package Release Token" (fvttp_...) from its edit page
      # on foundryvtt.com, stored as the FOUNDRY_RELEASE_TOKEN repository secret.
      - name: Publish to the Foundry package listing
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ -z "$FOUNDRY_RELEASE_TOKEN" ]]; then
            echo "::warning::FOUNDRY_RELEASE_TOKEN is not set; skipped the foundryvtt.com release"
            exit 0
          fi
          body="$(node -e '
            const m = require("./module.json");
            const base = `https://github.com/${process.env.REPO}/releases`;
            console.log(JSON.stringify({
              id: m.id,
              release: {
                version: m.version,
                manifest: `${base}/download/${process.env.TAG}/module.json`,
                notes: `${base}/tag/${process.env.TAG}`,
                compatibility: { minimum: m.compatibility.minimum, verified: m.compatibility.verified },
              },
            }));')"
          curl --fail-with-body -sS -X POST https://foundryvtt.com/_api/packages/release_version/ \
            -H "Content-Type: application/json" \
            -H "Authorization: $FOUNDRY_RELEASE_TOKEN" \
            -d "$body"
